<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/brand/kunsang-gar-site-logo.png">
  <title>Acceso al CMS | Kunsang Gar</title>
  <link rel="stylesheet" href="/admin/admin.css?v=cms-ops-20261019-11">
  <style>
    .admin-login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
    .admin-login-language{position:fixed;top:18px;right:22px;display:flex;align-items:center;gap:8px;color:#fff;font-size:.82rem;font-weight:800}
    .admin-login-language button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:8px}
    .admin-login-language button[aria-pressed="true"]{color:#f0c276;text-decoration:underline;text-underline-offset:4px}
    .admin-login-language button:focus-visible{outline:3px solid #dba63d;outline-offset:2px;border-radius:4px}
    .admin-login-card{width:min(100%,480px);padding:clamp(22px,5vw,38px);background:var(--admin-panel);border:1px solid var(--admin-line);border-radius:12px;box-shadow:var(--admin-shadow)}
    .admin-login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-weight:900;color:var(--admin-navy)}
    .admin-login-brand img{display:none}
    .admin-login-brand::before{content:"";display:block;flex:0 0 48px;width:48px;height:48px;border:1px solid #d49a3c;border-radius:50%;background:#fff url('/assets/brand/kunsang-gar-site-logo.png') center/235% 197% no-repeat}
    .admin-login-card h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.8rem)}
    .admin-login-card>p{margin-bottom:22px}
    .admin-login-form{display:grid;gap:15px}
    .admin-login-form[hidden]{display:none!important}
    .admin-login-reset{margin:12px 0;padding:4px 0;border:0;background:transparent;color:#8a342e;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    .admin-login-reset:focus-visible{outline:3px solid #dba63d;outline-offset:4px}
    .admin-login-form .btn{width:100%;margin-top:4px}
    .admin-login-status{margin-top:16px;padding:12px;border-radius:8px;background:#f3eadc;color:var(--admin-ink)}
    .admin-login-status[data-status="error"]{background:#fae9e6;color:#7f2627}
  </style>
</head>
<body class="admin-login-page" data-platform-page="admin-login" data-auth-role="CMS">
  <div class="admin-login-language language-switcher" role="group" aria-label="Language / Idioma"><button type="button" data-login-lang="es" aria-label="Español" aria-pressed="false">🇲🇽 ES</button><span aria-hidden="true">|</span><button type="button" data-login-lang="en" aria-label="English" aria-pressed="false">🇺🇸 EN</button></div>
  <main class="admin-login-wrap">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <a class="admin-login-brand" href="https://kunsanggar.com/" aria-label="Kunsang Gar">
        <img src="/assets/brand/kunsang-gar-site-logo.png" alt="">
        <span>Kunsang Gar</span>
      </a>
      <h1 id="admin-login-title">Acceso al CMS</h1>
      <form class="admin-login-form" data-login-form>
        <label class="field" for="admin-email">Correo electrónico<input id="admin-email" name="email" type="email" autocomplete="username" required></label>
        <label class="field" for="admin-password">Contraseña<input id="admin-password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Entrar al CMS</button>
      </form>
      <button class="admin-login-reset" type="button" data-show-password-reset>¿Olvidaste tu contraseña?</button>
      <form class="admin-login-form" data-password-reset-request hidden>
        <label class="field" for="cms-reset-email">Correo electrónico<input id="cms-reset-email" name="email" type="email" autocomplete="email" required></label>
        <button class="btn" type="submit">Enviar enlace para restablecer</button>
      </form>
      <form class="admin-login-form" data-password-reset-complete hidden>
        <label class="field" for="cms-new-password">Nueva contraseña<input id="cms-new-password" name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn" type="submit">Guardar nueva contraseña</button>
      </form>
      <div class="admin-login-status" data-platform-status role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script>
    (() => {
      const key = "kunsang-language";
      const params = new URLSearchParams(location.search);
      let lang = params.get("lang");
      if (!['es', 'en'].includes(lang)) {
        try { lang = localStorage.getItem(key); } catch (_) { lang = null; }
      }
      lang = ['es', 'en'].includes(lang) ? lang : 'es';
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-login-lang]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.loginLang === lang));
        button.addEventListener('click', () => {
          const selected = button.dataset.loginLang;
          try { localStorage.setItem(key, selected); } catch (_) {}
          params.set('lang', selected);
          location.assign(`${location.pathname}?${params.toString()}`);
        });
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/platform-config.js?v=public-classes-1"></script>
  <script src="/assets/platform.js?v=password-recovery-20261024-1"></script>
  <script src="/assets/i18n.js?v=i18n-20261024-5"></script>
</body>
</html>
