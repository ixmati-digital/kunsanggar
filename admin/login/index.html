<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/brand/kunsang-gar-site-logo.png">
  <title>Acceso al CMS | Kunsang Gar</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .admin-login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
    .admin-login-card{width:min(100%,480px);padding:clamp(22px,5vw,38px);background:var(--admin-panel);border:1px solid var(--admin-line);border-radius:12px;box-shadow:var(--admin-shadow)}
    .admin-login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-weight:900;color:var(--admin-navy)}
    .admin-login-brand img{width:48px;height:48px;object-fit:cover;border-radius:50%}
    .admin-login-card h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.8rem)}
    .admin-login-card>p{margin-bottom:22px}
    .admin-login-form{display:grid;gap:15px}
    .admin-login-form .btn{width:100%;margin-top:4px}
    .admin-login-status{margin-top:16px;padding:12px;border-radius:8px;background:#f3eadc;color:var(--admin-ink)}
    .admin-login-status[data-status="error"]{background:#fae9e6;color:#7f2627}
  </style>
</head>
<body class="admin-login-page" data-platform-page="admin-login" data-auth-role="ADMIN">
  <main class="admin-login-wrap">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <a class="admin-login-brand" href="/" aria-label="Kunsang Gar">
        <img src="/assets/brand/kunsang-gar-site-logo.png" alt="">
        <span>Kunsang Gar México</span>
      </a>
      <h1 id="admin-login-title">Acceso al CMS</h1>
      <form class="admin-login-form" data-login-form>
        <label class="field" for="admin-email">Correo electrónico<input id="admin-email" name="email" type="email" autocomplete="username" required></label>
        <label class="field" for="admin-password">Contraseña<input id="admin-password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Entrar al CMS</button>
      </form>
      <div class="admin-login-status" data-platform-status role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/platform-config.js?v=22caf6a"></script>
  <script src="/assets/platform.js?v=copy-cleanup-v1"></script>
</body>
</html>
